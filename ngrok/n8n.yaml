  # Rate limiting costs 1 TPU (Traffic Policy Unit) per execution, with 1 TPU costing $0.000001.
  # For example, $1 covers around 1 million rate-limit action executions.
  # It's not free, which is why it's disabled by default, but is an option for preventing excessive traffic reaching n8n.
  # It's placed last so requests we can identify as unwanted are blocked first,
  # and we only pay to rate-limit potentially valid requests.
